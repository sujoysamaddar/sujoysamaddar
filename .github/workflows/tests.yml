name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  editor-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: pytest -q tests/test_editor.py
      - name: Desktop GUI tests (Tkinter under a virtual display)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a pytest -q tests/test_gui.py
