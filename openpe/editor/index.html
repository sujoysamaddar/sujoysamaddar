<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPE Schematic Editor</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2330; --muted: #6b7280; --line: #d9dde4;
  --accent: #2563eb; --accent-ink: #ffffff; --wire: #0f766e; --sel: #d97706; --grid: #dfe3e9;
  --sig: #7c3aed; --err: #dc2626; --ok: #15803d; --comp: #1f2937; --hover: #eef2ff; --pin: #9ca3af;
  --canvas: #fbfbfc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1b1f26; --ink: #e5e7eb; --muted: #9aa3af; --line: #2e343e;
    --accent: #60a5fa; --accent-ink: #0b1220; --wire: #2dd4bf; --sel: #fbbf24; --grid: #222731;
    --sig: #a78bfa; --err: #f87171; --ok: #4ade80; --comp: #e5e7eb; --hover: #1f2a44; --pin: #6b7280;
    --canvas: #15181d;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1b1f26; --ink: #e5e7eb; --muted: #9aa3af; --line: #2e343e;
  --accent: #60a5fa; --accent-ink: #0b1220; --wire: #2dd4bf; --sel: #fbbf24; --grid: #222731;
  --sig: #a78bfa; --err: #f87171; --ok: #4ade80; --comp: #e5e7eb; --hover: #1f2a44; --pin: #6b7280;
  --canvas: #15181d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
#app { display: grid; height: 100vh; grid-template-rows: auto 1fr auto var(--bottom-h, 240px);
  grid-template-columns: 210px 1fr 260px;
  grid-template-areas: "top top top" "pal canvas props" "status status status" "bottom bottom bottom"; }
#top { grid-area: top; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
#top .brand { font-weight: 650; margin-right: 8px; }
#top .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 9px;
  cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
#palette { grid-area: pal; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 8px; }
#palette input[type=search] { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); margin-bottom: 6px; }
.cat { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.item { border: 1px solid var(--line); border-radius: 6px; padding: 3px 2px 2px; text-align: center; cursor: grab;
  user-select: none; background: var(--panel); font-size: 11px; touch-action: none; }
.item:hover { background: var(--hover); border-color: var(--accent); }
.item.armed { outline: 2px solid var(--accent); }
.item svg { width: 100%; height: 34px; display: block; color: var(--comp); }
#canvasWrap { grid-area: canvas; position: relative; overflow: hidden; background: var(--canvas); }
#svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; }
#svg.placing, #svg.wiring { cursor: crosshair; }
#svg.panning { cursor: grabbing; }
#tuner { position: absolute; z-index: 5; width: 270px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: 8px 10px; }
#tuner[hidden] { display: none; }
#tuner .th { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
#tuner .tr { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
#tuner input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }
#tuner input[type=text].bad { border-color: var(--err); }
#tuner input[type=range] { width: 100%; }
#tuner select { padding: 3px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }
#tuner .btn { padding: 3px 8px; }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); padding: 2px 6px;
  border-radius: 4px; font-size: 11px; display: none; white-space: nowrap; }
#props { grid-area: props; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px; }
#props h3 { margin: 0 0 8px; font-size: 14px; }
#props h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
.field label { color: var(--muted); font-size: 12px; }
.field input[type=text], .field select { width: 100%; padding: 4px 6px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--bg); }
.field input.bad { border-color: var(--err); }
.hint { color: var(--muted); font-size: 12px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; background: var(--bg); }
#status { grid-area: status; display: flex; gap: 16px; padding: 3px 10px; font-size: 12px; color: var(--muted);
  background: var(--panel); border-top: 1px solid var(--line); }
#status .err { color: var(--err); }
#bottom { grid-area: bottom; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); min-height: 0; }
#resizer { height: 5px; cursor: ns-resize; background: transparent; margin-top: -3px; }
#tabs { display: flex; gap: 2px; padding: 4px 8px 0; border-bottom: 1px solid var(--line); }
.tab { padding: 4px 10px; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--muted); }
.tab.on { border-color: var(--line); color: var(--ink); background: var(--bg); }
#tabBody { flex: 1; overflow: auto; padding: 8px; min-height: 0; }
#tabBody pre { margin: 0; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.plot { width: 100%; height: 150px; display: block; margin-bottom: 4px; }
table.op { border-collapse: collapse; font-variant-numeric: tabular-nums; margin-right: 24px; display: inline-table; vertical-align: top; }
table.op td, table.op th { border-bottom: 1px solid var(--line); padding: 2px 10px; text-align: right; }
table.op th { color: var(--muted); font-weight: 500; text-align: left; }
.msg-err { color: var(--err); } .msg-ok { color: var(--ok); }
svg .gridline { stroke: var(--grid); }
svg .comp { color: var(--comp); }
svg .comp.sel { color: var(--sel); }
svg .comp.ghost { opacity: .55; }
svg .wire { stroke: var(--wire); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg .wire.sig { stroke: var(--sig); stroke-dasharray: 6 3; }
svg .wire.sel { stroke: var(--sel); stroke-width: 3; }
svg .wire.hl { stroke-width: 4; }
svg .wire.preview { stroke: var(--accent); stroke-dasharray: 4 3; }
svg .jdot { fill: var(--wire); }
svg .pin { fill: var(--canvas); stroke: var(--pin); stroke-width: 1.2; }
svg .pin.open { stroke: var(--err); }
svg .pin.hot { fill: var(--accent); stroke: var(--accent); }
svg .lbl { fill: var(--ink); font-size: 11px; }
svg .val { fill: var(--muted); font-size: 10px; }
svg .oplbl { fill: var(--ok); font-size: 10px; font-weight: 600; }
svg .box { fill: rgba(37, 99, 235, .08); stroke: var(--accent); stroke-dasharray: 4 3; }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 120px 1fr auto auto var(--bottom-h, 200px);
    grid-template-areas: "top" "pal" "canvas" "props" "status" "bottom"; }
  #props { max-height: 180px; border-left: none; border-top: 1px solid var(--line); }
  .items { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="brand">OpenPE</span>
    <button class="btn" id="bNew" title="New schematic">New</button>
    <button class="btn" id="bOpen" title="Open schematic (.json)">Open</button>
    <button class="btn" id="bSave" title="Save schematic (Ctrl+S)">Save</button>
    <select class="btn" id="bExamples" title="Load an example"><option value="">Examples…</option></select>
    <span class="sep"></span>
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    <button class="btn" id="bSelect" title="Select / move (Esc)">Select</button>
    <button class="btn" id="bWire" title="Wire tool (W)">Wire</button>
    <button class="btn" id="bRotate" title="Rotate (R)">⟳ Rotate</button>
    <button class="btn" id="bFlip" title="Flip (F)">⇋ Flip</button>
    <button class="btn" id="bDelete" title="Delete (Del)">Delete</button>
    <span class="sep"></span>
    <button class="btn" id="bFit" title="Zoom to fit (Home)">Fit</button>
    <button class="btn" id="bGrid" title="Snap to grid (G)">Snap</button>
    <button class="btn" id="bNetlist" title="Download netlist (.net)">Netlist ⤓</button>
    <button class="btn" id="bSettings" title="Simulation settings">Analyses…</button>
    <button class="btn" id="bStd" title="Snap resistor, capacitor and inductor values to the chosen standard series (the selection, or everything if nothing is selected)">Std values</button>
    <select class="btn" id="bSeries" title="Standard series"><option>E6</option><option>E12</option><option selected>E24</option><option>E48</option><option>E96</option></select>
    <button class="btn" id="bAuto" title="Re-run the simulation automatically after every change">Auto-run</button>
    <button class="btn primary" id="bRun" title="Run simulation (F5 / Ctrl+Enter)">▶ Run</button>
    <span class="sep"></span>
    <button class="btn" id="bTheme" title="Toggle light/dark">◐</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
  <div id="palette">
    <input type="search" id="search" placeholder="Search parts…  ( / )" autocomplete="off">
    <div id="palList"></div>
    <p class="hint" style="margin-top:12px">Drag a part onto the canvas, or click it and click on the canvas
      (hold <kbd>Shift</kbd> to place several). Drag from a pin to draw a wire.</p>
  </div>
  <div id="canvasWrap">
    <svg id="svg" tabindex="0" aria-label="Schematic canvas"></svg>
    <div id="tip"></div>
    <div id="tuner" hidden>
      <div class="th"><b id="tuTitle"></b><button class="btn" id="tuClose" title="Close (Esc)">×</button></div>
      <select id="tuProp" style="width:100%"></select>
      <div class="tr"><input type="text" id="tuVal" spellcheck="false" title="↑/↓: ±10 %, Shift: ×10, PageUp/PageDown: next standard value">
        <button class="btn" id="tuReset" title="Back to the value when the tuner opened">Reset</button></div>
      <input type="range" id="tuSlider" min="-100" max="100" step="1" value="0" title="Slide ÷10 … ×10 around the starting value">
      <div class="tr"><span class="hint">Standard</span>
        <select id="tuSeries"><option>E6</option><option>E12</option><option selected>E24</option><option>E48</option><option>E96</option></select>
        <button class="btn" id="tuDn" title="Previous standard value (PageDown)">◀</button>
        <button class="btn" id="tuUp" title="Next standard value (PageUp)">▶</button>
        <button class="btn" id="tuSnap" title="Nearest standard value">Snap</button></div>
      <div class="hint" id="tuInfo"></div>
    </div>
  </div>
  <div id="props"></div>
  <div id="status"><span id="stMode">Select</span><span id="stPos"></span><span id="stInfo"></span><span id="stMsg"></span></div>
  <div id="bottom">
    <div id="resizer" title="Drag to resize"></div>
    <div id="tabs">
      <span class="tab on" data-tab="wave">Waveforms</span>
      <span class="tab" data-tab="ac">AC / DC sweep</span>
      <span class="tab" data-tab="op">Operating point</span>
      <span class="tab" data-tab="loss">Losses</span>
      <span class="tab" data-tab="netlist">Netlist</span>
      <span class="tab" data-tab="msg">Messages</span>
    </div>
    <div id="tabBody"></div>
  </div>
</div>
<script>
"use strict";
// ===================================================================
// Constants and helpers
// ===================================================================
const G = 10;                                   // grid pitch (world units)
const COLORS = ["#2563eb", "#dc2626", "#16a34a", "#d97706", "#7c3aed", "#0891b2", "#db2777", "#65a30d"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const key = (x, y) => x + "," + y;
let snapOn = true;
const snap = (v) => (snapOn ? Math.round(v / G) * G : Math.round(v));

function fmtEng(v, unit = "") {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  if (v === 0) return "0" + unit;
  const pre = [[1e12, "T"], [1e9, "G"], [1e6, "M"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "µ"], [1e-9, "n"], [1e-12, "p"], [1e-15, "f"]];
  const a = Math.abs(v);
  for (const [m, p] of pre) if (a >= m * 0.9995) return +(v / m).toPrecision(4) + p + unit;
  return v.toExponential(3) + unit;
}
// accepts SPICE-style values: 10k, 4.7u, 2meg, 1e-3
// number -> SPICE text with an SI suffix (2200 -> "2.2k", 1e6 -> "1meg")
function fmtSpice(v) {
  if (!isFinite(v)) return String(v);
  if (v === 0) return "0";
  const pre = [[1e12, "T"], [1e9, "G"], [1e6, "meg"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "u"], [1e-9, "n"], [1e-12, "p"], [1e-15, "f"]];
  const a = Math.abs(v);
  for (const [m, p] of pre) if (a >= m * 0.9999999) return +(v / m).toPrecision(3) + p;
  return v.toPrecision(3);
}
// ---- standard component values (E-series), same tables as openpe.eseries
const E_TABLES = {
  E6: [1.0, 1.5, 2.2, 3.3, 4.7, 6.8],
  E12: [1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2],
  E24: [1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1],
  E48: Array.from({ length: 48 }, (_, k) => +Math.pow(10, k / 48).toFixed(2)),
  E96: Array.from({ length: 96 }, (_, k) => +Math.pow(10, k / 96).toFixed(2)),
};
function eSplit(v) { let d = Math.floor(Math.log10(v)); let m = v / Math.pow(10, d); if (m >= 10 - 1e-12) { d++; m /= 10; } return [d, m]; }
function eJoin(m, d) { return +(m * Math.pow(10, d)).toPrecision(6); }
function eNearest(v, s) {
  const t = E_TABLES[s].concat([10]); const [d, m] = eSplit(v);
  let best = t[0]; for (const x of t) if (Math.abs(Math.log(x / m)) < Math.abs(Math.log(best / m))) best = x;
  return eJoin(best, d);
}
function eStep(v, dir, s) {
  const t = E_TABLES[s]; const [d, m] = eSplit(v);
  if (dir > 0) { for (const x of t) if (x > m * (1 + 1e-9)) return eJoin(x, d); return eJoin(t[0], d + 1); }
  for (let i = t.length - 1; i >= 0; i--) if (t[i] < m * (1 - 1e-9)) return eJoin(t[i], d);
  return eJoin(t[t.length - 1], d - 1);
}
function parseVal(s) {
  const m = String(s).trim().match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)(meg|[fpnuµmkgt])?[a-zA-Z]*$/i);
  if (!m) return NaN;
  const mult = { f: 1e-15, p: 1e-12, n: 1e-9, u: 1e-6, "µ": 1e-6, m: 1e-3, k: 1e3, meg: 1e6, g: 1e9, t: 1e12 };
  return parseFloat(m[1]) * (m[2] ? mult[m[2].toLowerCase()] : 1);
}

// ===================================================================
// Component library
// ===================================================================
// pin kinds: p = power/electrical node, s = control signal, a = any (probe)
const P = (x, y, n, k = "p") => ({ x, y, n, k });
const SYM = {
  res: '<path d="M-30 0H-18l3-6 6 12 6-12 6 12 6-12 6 12 3-6H30" class="st"/>',
  ind: '<path d="M-30 0H-20a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0H30" class="st"/>',
  cap: '<path d="M-30 0H-4M-4-11V11M4-11V11M4 0H30" class="st"/>',
  diode: '<path d="M-30 0H-8M8 0H30M8-9V9" class="st"/><path d="M-8-9V9L8 0Z" class="fl"/>',
  zener: '<path d="M-30 0H-8M8 0H30M4-11L8-9V9L12 11" class="st"/><path d="M-8-9V9L8 0Z" class="fl"/>',
  dpn: '<path d="M-30 0H-8M8 0H30M8-9V9" class="st"/><path d="M-8-9V9L8 0Z" class="st"/><circle r="15" class="st thin"/>',
  vdc: '<path d="M0-30V-14M0 14V30" class="st"/><circle r="14" class="st"/><path d="M-4-6H4M0-10V-2M-4 7H4" class="st thin"/>',
  vsin: '<path d="M0-30V-14M0 14V30" class="st"/><circle r="14" class="st"/><path d="M-8 0C-6-8-2-8 0 0S6 8 8 0" class="st thin"/>',
  vpulse: '<path d="M0-30V-14M0 14V30" class="st"/><circle r="14" class="st"/><path d="M-8 5H-4V-5H2V5H8" class="st thin"/>',
  idc: '<path d="M0-30V-14M0 14V30" class="st"/><circle r="14" class="st"/><path d="M0 8V-7M-4-3L0-8L4-3" class="st thin"/>',
  sw: '<path d="M-30 0H-12M12 0H30M-12 0L10-9" class="st"/><circle cx="-12" r="2" class="fl"/><circle cx="12" r="2" class="fl"/>' +
      '<path d="M0-20V-6" class="st thin dash"/>',
  scr: '<path d="M-30 0H-8M8 0H30M8-9V9M8 3L10 8V20" class="st"/><path d="M-8-9V9L8 0Z" class="fl"/>',
  xfmr: '<path d="M-30-20H-12M-30 20H-12M30-20H12M30 20H12" class="st"/>' +
        '<path d="M-12-20a5 5 0 0 1 0 10a5 5 0 0 1 0 10a5 5 0 0 1 0 10a5 5 0 0 1 0 10" class="st"/>' +
        '<path d="M12-20a5 5 0 0 0 0 10a5 5 0 0 0 0 10a5 5 0 0 0 0 10a5 5 0 0 0 0 10" class="st"/>' +
        '<path d="M-2-22V22M2-22V22" class="st thin"/><circle cx="-17" cy="-24" r="2" class="fl"/><circle cx="17" cy="-24" r="2" class="fl"/>',
  motor: '<path d="M0-30V-16M0 16V30" class="st"/><circle r="16" class="st"/><text y="5" text-anchor="middle" class="sym">M</text>',
  npn: '<circle r="18" class="st thin"/><path d="M-30 0H-8M-8-11V11M-8-5L10-17V-30M-8 5L10 17V30" class="st"/><path d="M10 17L2 16L6 10Z" class="fl"/>',
  pnp: '<circle r="18" class="st thin"/><path d="M-30 0H-8M-8-11V11M-8-5L10-17V-30M-8 5L10 17V30" class="st"/><path d="M-8 5L0 6L-4 12Z" class="fl"/>',
  nmos: '<path d="M-30 0H-12M-12-11V11M-6-13V13M-6-8H10V-30M-6 8H10V30M-6 0H10V8" class="st"/><path d="M-6 0L0-3V3Z" class="fl"/>',
  pmos: '<path d="M-30 0H-12M-12-11V11M-6-13V13M-6-8H10V-30M-6 8H10V30M-6 0H10V8" class="st"/><path d="M4 0L-2-3V3Z" class="fl"/>',
  opamp: '<path d="M-28-28V28L30 0Z" class="st"/><path d="M-40-10H-28M-40 10H-28M30 0H40" class="st"/>' +
         '<path d="M-23-10H-15M-23 10H-15M-19 6V14" class="st thin"/>',
  gnd: '<path d="M0-10V0M-10 0H10M-6 4H6M-2 8H2" class="st"/>',
  label: '<path d="M0 0L6-7H34V7H6Z" class="st thin"/>',
  probe: '<path d="M0 0L-8-10" class="st thin"/><circle cx="-13" cy="-16" r="7" class="st thin"/><text x="-13" y="-12.5" text-anchor="middle" class="sym small">V</text>',
  isense: '<path d="M-30 0H30" class="st"/><circle r="9" class="st thin"/><path d="M-4 0H4M1-3L4 0L1 3M0-9V-20" class="st thin"/>',
};
function blockSym(text, ins, outs) {
  let s = '<rect x="-30" y="-20" width="60" height="40" rx="4" class="st blk"/>';
  for (const [x, y] of ins) s += `<path d="M${x} ${y}H-30" class="st sigl"/>`;
  for (const [x, y] of outs) s += `<path d="M30 ${y}H${x}" class="st sigl"/>`;
  return s + `<text y="4" text-anchor="middle" class="sym small">${text}</text>`;

function nm(c, letter) {
  const n = String(c.props.name).replace(/\s+/g, "");
  return n.toUpperCase().startsWith(letter) ? n : letter + n;
}

const defaultSim = () => ({
  tran: true, dt: "1u", tend: "10m", tstart: "0", init: "ic",
  op: false, ac: false, acpts: "20", acstart: "10", acstop: "1meg",
  dc: false, dcsrc: "", dcstart: "0", dcstop: "5", dcstep: "0.1", title: "schematic",
  loss: false, lossIn: "", lossOut: "",
});
let doc = { comps: [], wires: [], sim: defaultSim(), nextId: 1 };
let sel = new Set();           // selected ids ("c12", "w3")
let undoStack = [], redoStack = [];
let netCache = null;
let opAnnot = null;            // {netName: voltage} from last .op
let lastResults = null;

const snapshot = () => JSON.stringify({ comps: doc.comps, wires: doc.wires, sim: doc.sim, nextId: doc.nextId });
function commit(label) {
  if (typeof forgetPress === "function") forgetPress();
  undoStack.push(lastSnap);
  if (undoStack.length > 300) undoStack.shift();
  redoStack = [];
  lastSnap = snapshot();
  changed(label);
}
let lastSnap = snapshot();
function restore(s) {
  const o = JSON.parse(s);
  doc.comps = o.comps; doc.wires = o.wires; doc.sim = Object.assign(defaultSim(), o.sim || {}); doc.nextId = o.nextId || 1;
  sel = new Set([...sel].filter((id) => findAny(id)));
  lastSnap = snapshot();

  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "c") { e.preventDefault(); copySel(); return; }
  if (mod && e.key.toLowerCase() === "x") { e.preventDefault(); copySel(); deleteSel(); return; }
  if (mod && e.key.toLowerCase() === "v") { e.preventDefault(); pasteClip(); return; }
  if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateSelection(); return; }
  if (mod && e.key.toLowerCase() === "a") { e.preventDefault(); sel = new Set([...doc.comps, ...doc.wires].map((x) => x.id)); render(); renderProps(); return; }
  if (mod) return;
  switch (e.key) {
    case "Escape": if (mode.t === "wire" && mode.pts.length > 1) finishWire(mode.pts[mode.pts.length - 1]); else { cancelMode(); sel = new Set(); render(); renderProps(); } break;
    case "Delete": case "Backspace": deleteSel(); break;
    case "r": case "R": rotateSel(e.shiftKey ? -1 : 1); break;
    case "f": case "F": case "x": case "X": flipSel(); break;
    case "w": case "W": setTool(tool === "wire" ? "select" : "wire"); break;
    case "g": case "G": snapOn = !snapOn; updateButtons(); setMsg(`Snap to grid ${snapOn ? "on" : "off"}`); break;
    case "/": if (mode.t === "wire") { routeH = !wireHFirst(); render(); } else { e.preventDefault(); $("#search").focus(); } break;
    case "Home": fitView(); break;
    case "+": case "=": zoomBy(1.2); break;
    case "-": zoomBy(1 / 1.2); break;
    case "ArrowLeft": e.preventDefault(); nudge(-G, 0); break;
    case "ArrowRight": e.preventDefault(); nudge(G, 0); break;
    case "ArrowUp": e.preventDefault(); nudge(0, -G); break;
    case "ArrowDown": e.preventDefault(); nudge(0, G); break;
    default: {
      // quick-place hotkeys, as in most schematic editors
      const hk = { r: "R", l: "L", c: "C", v: "V", d: "D", s: "S" }[e.key];
      if (hk && e.altKey) startPlacing(hk);
    }
  }
});
document.addEventListener("keyup", (e) => { if (e.key === " ") spaceDown = false; });
function zoomBy(f) {
  const r = svg.getBoundingClientRect();
  const cx = view.x + r.width / 2 / view.k, cy = view.y + r.height / 2 / view.k;
  const k = Math.min(4, Math.max(0.2, view.k * f));
  view = { k, x: cx - r.width / 2 / k, y: cy - r.height / 2 / k };
  render();
}

// design-time tuning: step a numeric value by ±10 % (Shift: ×10 / ÷10)
function stepField(inp, dir, big) {

class Builder {
  constructor() { this.comps = []; this.wires = []; this.id = 1; }
  add(type, x, y, rot = 0, props = {}) {
    const T = TYPES[type];
    const p = { name: T.noName ? "" : this.name(T.prefix) };
    for (const [k, , def] of T.props) p[k] = def;
    Object.assign(p, props);
    const c = { id: "c" + this.id++, type, x, y, rot, flip: false, props: p };
    this.comps.push(c); return c;
  }
  name(prefix) { const used = new Set(this.comps.map((c) => c.props.name)); for (let i = 1; ; i++) if (!used.has(prefix + i)) return prefix + i; }
  pin(c, i) { const p = pinsOf(c)[i]; return [p.x, p.y]; }
  wire(c1, i1, c2, i2) { const a = this.pin(c1, i1), b = this.pin(c2, i2); this.wirePts([a, ...route(a, b, true)]); }
  wireTo(c, i, pt) { const a = this.pin(c, i); this.wirePts([a, ...route(a, pt, true)]); }
  wirePts(pts) { const s = simplify(pts); if (s.length >= 2) this.wires.push({ id: "w" + this.id++, pts: s }); }
  done(sim) { return { comps: this.comps, wires: this.wires, sim: Object.assign(defaultSim(), sim), nextId: this.id }; }
}

  for (const c of pool.filter((c) => ["R", "C", "L"].includes(c.type))) {
    const v = parseVal(c.props.value);
    if (!(v > 0)) continue;
    const n = eNearest(v, series);
    if (Math.abs(n - v) > 1e-9 * v) { const old = c.props.value; c.props.value = fmtSpice(n); rows.push(`${c.props.name}: ${old} → ${c.props.value} (${(100 * (n - v) / v).toFixed(2)} %)`); }
  }
  if (!rows.length) { setMsg(`All resistor/capacitor/inductor values are already ${series} values`); return; }
  messages = [["ok", `Snapped to ${series}:`], ...rows.map((r) => ["info", r])];
  commit(`Snapped ${rows.length} value(s) to ${series}`);
};

let msgTimer = null;

// ===================================================================
// Simulation and results
// ===================================================================
let curTab = "wave";
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { curTab = t.dataset.tab; renderTab(); }));
function showNetlistTab(n) { curTab = "netlist"; lastNetlist = n; renderTab(); }
let lastNetlist = null, messages = [];
let simRunning = false, simPending = false;
async function runSim(quiet = false) {
  if (simRunning) { simPending = true; return; }
  const n = buildNetlist();
  lastNetlist = n;
  messages = [...n.errors.map((x) => ["err", x]), ...n.warnings.map((x) => ["warn", x])];
  if (n.errors.length) { curTab = "msg"; renderTab(); setMsg(`Cannot run: ${n.errors[0]}`, true); return; }
  const btn = $("#bRun"); btn.disabled = true; btn.textContent = "Running…";
  simRunning = true;
  const keepTab = quiet && lastResults ? curTab : null;
  const t0 = performance.now();
  try {
    const resp = await fetch("/api/simulate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ netlist: n.text }) });
    const res = await resp.json();
    if (!res.ok) throw new Error(res.error);
    lastResults = res;
    opAnnot = res.op ? res.op.voltages : null;
    if (opAnnot) opAnnot["0"] = 0;
    messages.push(["ok", `Simulation finished in ${((performance.now() - t0) / 1000).toFixed(2)} s`]);
    if (res.tran && res.tran.stats) messages.push(["info", "Transient: " + Object.entries(res.tran.stats).map(([k, v]) => `${k}=${v}`).join(", ")]);
    if (res.measures) for (const [k, v] of Object.entries(res.measures)) messages.push(["info", `${k} = ${fmtEng(v)}`]);
    if (res.warnings) for (const w of res.warnings) messages.push(["warn", w]);
    curTab = keepTab && keepTab !== "msg" && keepTab !== "netlist" ? keepTab : res.tran ? "wave" : res.ac || res.dc ? "ac" : res.op ? "op" : "msg";
    if (res.losses && !keepTab) messages.push(["info", `Efficiency ${res.losses.efficiency != null ? (100 * res.losses.efficiency).toFixed(2) + " %" : "n/a"}, device losses ${(+res.losses.device_loss).toPrecision(4)} W (see the Losses tab)`]);
    setMsg(res.warnings && res.warnings.length ? `Simulation finished with ${res.warnings.length} warning(s) (see Messages)` : "Simulation finished");
    render();
  } catch (err) {
    const offline = err instanceof TypeError || location.protocol === "file:";
    messages.push(["err", offline ? "Cannot reach the OpenPE server. Start it with:  python -m openpe editor" : String(err.message || err)]);
    curTab = "msg"; setMsg(offline ? "Server not running (python -m openpe editor)" : "Simulation failed", true);
  } finally {
    btn.disabled = false; btn.textContent = "▶ Run"; simRunning = false; renderTab();

  }
}
function renderTab() {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === curTab));
  const body = $("#tabBody");
  const r = lastResults;
  if (curTab === "netlist") {
    const n = lastNetlist || buildNetlist();
    body.innerHTML = `<pre>${esc(n.text)}</pre>`; return;
  }
  if (curTab === "msg") {
    body.innerHTML = messages.length ? messages.map(([k, m]) => `<div class="${k === "err" ? "msg-err" : k === "ok" ? "msg-ok" : ""}">${k === "warn" ? "⚠ " : ""}${esc(m)}</div>`).join("")
      : '<p class="hint">No messages. Press ▶ Run to simulate.</p>';
    return;
  }
  if (curTab === "op") {
    if (!r || !r.op) { body.innerHTML = '<p class="hint">Enable “Operating point” in Analyses… and run. Node voltages are then shown on the schematic.</p>'; return; }
    const rows = (o, unit) => Object.entries(o).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${fmtEng(v, unit)}</td></tr>`).join("");
    body.innerHTML = `<table class="op"><tr><th>Node</th><th>Voltage</th></tr>${rows(r.op.voltages, "V")}</table>` +
      `<table class="op"><tr><th>Quantity</th><th>Value</th></tr>${Object.entries(r.op.probes).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${fmtEng(v, k.startsWith("I") ? "A" : "")}</td></tr>`).join("")}</table>`;
    return;
  }
  if (curTab === "loss") {
    const L = r && r.losses;
    if (!L) { body.innerHTML = '<p class="hint">Enable “Loss report” in Analyses… (give the input source and output element for efficiency), set <b>Turn-on / Turn-off energy</b> on the switches, and run.</p>'; return; }
    const W = (v) => (v === null || v === undefined ? "—" : (+v).toPrecision(4) + " W");
    body.innerHTML = `<table class="op"><tr><th>Device</th><th>Type</th><th>Conduction</th><th>Switching</th><th>Total</th></tr>` +
      L.rows.map((x) => `<tr><th>${esc(x.name)}</th><td>${esc(x.type)}</td><td>${W(x.conduction)}</td><td>${W(x.switching)}</td><td>${W(x.total)}</td></tr>`).join("") +
      `<tr><th>All devices</th><td></td><td>${W(L.conduction_loss)}</td><td>${W(L.switching_loss)}</td><td>${W(L.device_loss)}</td></tr></table>` +
      `<div class="hint" style="margin-top:6px">window ${(L.window[0] * 1e3).toPrecision(4)} … ${(L.window[1] * 1e3).toPrecision(4)} ms` +
      (L.efficiency != null ? ` · input ${W(L.p_in)} (circuit) + ${W(L.switching_loss)} switching loss · output ${W(L.p_out)} · other ${W(L.other_loss)} · <b>efficiency ${(100 * L.efficiency).toFixed(2)} %</b>` : " · set an input source and output element for efficiency") + `</div>`;
    return;
  }
  if (curTab === "wave") {
    if (!r || !r.tran) { body.innerHTML = '<p class="hint">Place <b>Probe</b> parts (or set “Plot current”), enable Transient and press ▶ Run.</p>'; return; }
    body.innerHTML = "";
    const names = Object.keys(r.tran.signals);
    names.forEach((n, i) => addPlot(body, r.tran.t, [{ name: n, data: r.tran.signals[n], color: COLORS[i % COLORS.length] }], { xunit: "s", yunit: n.startsWith("I(") ? "A" : n.startsWith("V(") ? "V" : "",
      marks: (r.changes || []).map((c) => ({ x: c.t, label: `${c.target} → ${fmtEng(c.value)}` })) }));
    return;
  }
  if (curTab === "ac") {
    body.innerHTML = "";
    if (r && r.ac) {
      const tr = Object.entries(r.ac.traces);

      addPlot(body, r.ac.freq, tr.map(([n, t], i) => ({ name: `∠${n}°`, data: t.phase_deg, color: COLORS[i % COLORS.length] })), { logx: true, xunit: "Hz", yunit: "°" });
      const info = tr.map(([n, t]) => `${n}: peak ${t.peak_db.toFixed(2)} dB @ ${fmtEng(t.peak_hz, "Hz")}` +
        (t.f_low ? `, −3 dB low ${fmtEng(t.f_low, "Hz")}` : "") + (t.f_high ? `, −3 dB high ${fmtEng(t.f_high, "Hz")}` : "")).join("<br>");

    }

  }
}
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) { hi = lo + 1; lo = lo - 1; }
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || 10 * mag;
  const t = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) t.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return t;
}
function addPlot(parent, x, series, opt) {
  const cv = document.createElement("canvas");
  cv.className = "plot"; parent.appendChild(cv);
  const draw = (hx) => {
    const dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue("--ink").trim(), muted = css.getPropertyValue("--muted").trim(), line = css.getPropertyValue("--line").trim();
    g.clearRect(0, 0, W, H);
    const L = 64, R = 12, T = 8, B = 22, pw = W - L - R, ph = H - T - B;
    const fx = opt.logx ? (v) => Math.log10(v) : (v) => v;
    const xs = x.map(fx);
    const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 1 : xs[xs.length - 1];
    let y0 = Infinity, y1 = -Infinity;
    for (const s of series) for (const v of s.data) if (v !== null) { y0 = Math.min(y0, v); y1 = Math.max(y1, v); }
    if (!isFinite(y0)) { y0 = -1; y1 = 1; }
    if (y1 - y0 < 1e-12 * Math.max(1, Math.abs(y1))) { y0 -= 1e-3 * Math.max(1, Math.abs(y0)) || 1; y1 += 1e-3 * Math.max(1, Math.abs(y1)) || 1; }
    const pad = (y1 - y0) * 0.06; y0 -= pad; y1 += pad;
    const X = (v) => L + (v - x0) / (x1 - x0) * pw, Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * ph;
    g.font = "11px system-ui, sans-serif"; g.lineWidth = 1;
    g.strokeStyle = line; g.fillStyle = muted;
    const yt = niceTicks(y0, y1, 4);
    g.textAlign = "right"; g.textBaseline = "middle";
    for (const v of yt) { g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(L + pw, Y(v)); g.stroke(); g.fillText(fmtEng(v), L - 6, Y(v)); }
    g.textAlign = "center"; g.textBaseline = "top";
    if (opt.logx) {
      for (let d = Math.ceil(x0); d <= Math.floor(x1); d++) { g.beginPath(); g.moveTo(X(d), T); g.lineTo(X(d), T + ph); g.stroke(); g.fillText(fmtEng(Math.pow(10, d), opt.xunit), X(d), T + ph + 4); }
    } else {
      for (const v of niceTicks(x0, x1, 8)) { g.beginPath(); g.moveTo(X(v), T); g.lineTo(X(v), T + ph); g.stroke(); g.fillText(fmtEng(v, opt.xunit), X(v), T + ph + 4); }
    }
    g.strokeStyle = muted; g.strokeRect(L, T, pw, ph);
    if (opt.marks) {                       // scheduled value changes
      g.save(); g.setLineDash([4, 3]); g.strokeStyle = muted; g.fillStyle = muted; g.font = "10px system-ui, sans-serif";
      for (const m of opt.marks) {
        const mx = X(fx(m.x));
        if (!(mx >= L && mx <= L + pw)) continue;
        g.beginPath(); g.moveTo(mx, T); g.lineTo(mx, T + ph); g.stroke();
        g.save(); g.translate(mx - 3, T + ph - 4); g.rotate(-Math.PI / 2); g.textAlign = "left"; g.fillText(m.label, 0, 0); g.restore();
      }
      g.restore();
    }
    g.save(); g.beginPath(); g.rect(L, T, pw, ph); g.clip();
    for (const s of series) {
      g.strokeStyle = s.color; g.lineWidth = 1.5; g.beginPath();
      let pen = false;
      for (let i = 0; i < xs.length; i++) {
        const v = s.data[i];
        if (v === null) { pen = false; continue; }
        if (!pen) { g.moveTo(X(xs[i]), Y(v)); pen = true; } else g.lineTo(X(xs[i]), Y(v));
      }
      g.stroke();
    }
    g.restore();
    // legend + cursor readout
    g.textAlign = "left"; g.textBaseline = "top";
    let lx = L + 8;
    let idx = null;
    if (hx !== undefined && hx >= L && hx <= L + pw) {
      const xv = x0 + (hx - L) / pw * (x1 - x0);
      let lo = 0, hi = xs.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] < xv) lo = m; else hi = m; }
      idx = Math.abs(xs[lo] - xv) < Math.abs(xs[hi] - xv) ? lo : hi;
      g.strokeStyle = muted; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(xs[idx]), T); g.lineTo(X(xs[idx]), T + ph); g.stroke(); g.setLineDash([]);
    }
    for (const s of series) {
      const txt = idx === null ? s.name : `${s.name} = ${fmtEng(s.data[idx], opt.yunit)}`;
      g.fillStyle = s.color; g.fillRect(lx, T + 6, 10, 3);
      g.fillStyle = ink; g.fillText(txt, lx + 14, T + 2);
      lx += g.measureText(txt).width + 30;
    }
    if (idx !== null) { g.fillStyle = muted; g.textAlign = "right"; g.fillText((opt.xlabel ? opt.xlabel + " " : "") + fmtEng(x[idx], opt.xunit), L + pw - 4, T + 2); }
  };
  cv.addEventListener("mousemove", (e) => draw(e.offsetX));
  cv.addEventListener("mouseleave", () => draw());
  requestAnimationFrame(() => draw());
}
// bottom panel resizing
$("#resizer").addEventListener("pointerdown", (e) => {
  const start = e.clientY, h0 = $("#bottom").getBoundingClientRect().height;
  const move = (ev) => { const h = Math.max(60, Math.min(window.innerHeight - 200, h0 - (ev.clientY - start))); document.getElementById("app").style.setProperty("--bottom-h", h + "px"); render(); };

  get results() { return lastResults; }, undo, redo, get selection() { return [...sel]; }, EXAMPLES,
